[package]
name = "tmux-atelier"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
glob = "0.3"
inquire = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
