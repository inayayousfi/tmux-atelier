name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install runtime and shell dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux
      - name: Check Rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
      - name: Check shell files
        run: |
          bash -n install.sh tests/install tests/fixtures/ssh tests/fixtures/tmux
          sh -n tmux-atelier.tmux
          shellcheck install.sh tmux-atelier.tmux tests/install tests/fixtures/ssh tests/fixtures/tmux
      - name: Test installer
        run: ./tests/install
