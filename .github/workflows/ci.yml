name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install runtime and shell dependencies
        run: sudo apt-get update && sudo apt-get install -y fzf shellcheck tmux
      - name: Check Rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
      - name: Check shell files
        run: |
          bash -n install.sh tmux-atelier.tmux tests/install tests/run
          shellcheck install.sh tmux-atelier.tmux tests/install tests/run tests/fixtures/fzf tests/fixtures/ssh tests/fixtures/tmux tests/fixtures/tmux-log tests/fixtures/tmux-ui
      - name: Test installer
        run: ./tests/install
      - name: Test tmux integration
        run: ./tests/run
